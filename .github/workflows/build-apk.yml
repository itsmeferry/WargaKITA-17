name: Build WargaKITA APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak Paket Android
        run: unzip -o WargaKITA_GitHub_Backup.zip -d extracted_repo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Debug APK
        working-directory: extracted_repo/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-debug-apk
          path: extracted_repo/android/app/build/outputs/apk/debug/app-debug.apk
