name: Build WargaKITA APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan Sumber Android
        run: |
          rm -rf extracted_repo
          if [ -f "WargaKITA_GitHub_Backup_v1.15.3.zip" ]; then
            LATEST_ZIP="WargaKITA_GitHub_Backup_v1.15.3.zip"
          else
            LATEST_ZIP=$(ls -1 WargaKITA_GitHub_Backup*.zip 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -n "$LATEST_ZIP" ] && [ -f "$LATEST_ZIP" ]; then
            unzip -oq "$LATEST_ZIP" -d extracted_repo
          elif [ -f "android/app/build.gradle.kts" ]; then
            mkdir -p extracted_repo
            cp -r android extracted_repo/android
          else
            echo "Folder android/ atau file WargaKITA_GitHub_Backup*.zip tidak ditemukan."
            exit 1
          fi
          cat << 'PROPS' > extracted_repo/android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          PROPS

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan Keystore & Build APK
        working-directory: extracted_repo/android
        env:
          WK_KEYSTORE_B64: ${{ secrets.WK_KEYSTORE_BASE64 }}
          WK_KEYSTORE_PASS: ${{ secrets.WK_KEYSTORE_PASS }}
          WK_KEY_ALIAS: ${{ secrets.WK_KEY_ALIAS || secrets.WK_KEYSTORE_ALIAS }}
          WK_KEY_PASS: ${{ secrets.WK_KEY_PASS || secrets.WK_KEYSTORE_PASS }}
        run: |
          if [ -n "$WK_KEYSTORE_B64" ]; then
            echo "$WK_KEYSTORE_B64" | base64 -d > release.keystore
            export WK_KEYSTORE_PATH="$(pwd)/release.keystore"
            if [ -z "$WK_KEY_ALIAS" ]; then
              WK_KEY_ALIAS=$(keytool -list -keystore release.keystore -storepass "$WK_KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n1 | sed 's/.*Alias name:[[:space:]]*//I' | tr -d '\r' || true)
              export WK_KEY_ALIAS
            fi
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../WargaKITA-RT17-v1.15.3.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../WargaKITA-RT17-v1.15.3.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-v1.15.3-apk
          path: WargaKITA-RT17-v1.15.3.apk

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.15.3' }}
          name: WargaKITA RT 17 (v1.15.3)
          files: WargaKITA-RT17-v1.15.3.apk
          make_latest: true
          body: |
            ## Pembaruan WargaKITA v1.15.3 (versionCode 25)
            ### NawakAI Agent AI, Voice Command & Export Data
            - **UI Baru Flat UI (Popup Messenger + Chatbox Gemini):** Popup mengambang bebas kedip dengan animasi spring Android 60fps, ikon wajik 6 ekspresi NawakAI, layar Beranda grid 2×2, dan tombol Henti Paksa (`□`).
            - **Voice Command Native Android (`id-ID`):** Inline `SpeechRecognizer` senyap + 14-bar live RMS waveform tanpa popup sistem Google.
            - **Export Multi-Status, Word `.docx` Valid & Footer PDF Serasi PNG:** Generator `.docx` OOXML asli (bebas error file rusak), filter status warga (Permanen, Kontrak, Kost, Janda, Pindah Domisili, Meninggal Dunia), pemisahan Warga Kontrak di bagian paling bawah tabel, dan footer PDF 7 kartu KPI serasi PNG.
            - **Jadwal Ronda Desember 2026 & Sinkronisasi Kalender Otomatis:** Rolling 31 hari Desember 2026 dengan reminder harian 19:00 WIB ke HP Pak RT, auto-sync kalender HP saat install/update/refresh, dan auto-hapus setelah ronda selesai (`04:00 WIB`).
