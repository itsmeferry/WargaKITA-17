name: Build WargaKITA APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan Sumber Android
        run: |
          rm -rf extracted_repo
          if [ -f "WargaKITA_GitHub_Backup_v1.15.0.zip" ]; then
            unzip -q WargaKITA_GitHub_Backup_v1.15.0.zip -d extracted_repo
          elif [ -f "WargaKITA_GitHub_Backup.zip" ]; then
            unzip -q WargaKITA_GitHub_Backup.zip -d extracted_repo
          else
            mkdir -p extracted_repo
            cp -r android extracted_repo/android
          fi
          cat << 'PROPS' > extracted_repo/android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          PROPS

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan Keystore & Build APK
        working-directory: extracted_repo/android
        env:
          WK_KEYSTORE_B64: ${{ secrets.WK_KEYSTORE_BASE64 }}
          WK_KEYSTORE_PASS: ${{ secrets.WK_KEYSTORE_PASS }}
          WK_KEYSTORE_ALIAS: ${{ secrets.WK_KEYSTORE_ALIAS }}
          WK_KEYSTORE_PASS_ENV: ${{ secrets.WK_KEYSTORE_PASS }}
        run: |
          if [ -n "$WK_KEYSTORE_B64" ]; then
            echo "$WK_KEYSTORE_B64" | base64 -d > release.keystore
            export WK_KEYSTORE_PATH="$(pwd)/release.keystore"
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../WargaKITA-RT17-v1.15.0.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../WargaKITA-RT17-v1.15.0.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-v1.15.0-apk
          path: WargaKITA-RT17-v1.15.0.apk

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.15.0' }}
          name: WargaKITA RT 17 (v1.15.0)
          files: WargaKITA-RT17-v1.15.0.apk
          make_latest: true
          body: |
            ## Pembaruan WargaKITA v1.15.0 (versionCode 22)
            ### NawakAI Agent AI & UI Baru
            - **Popup Ala Messenger + Chatbox Gemini (Flat UI):** Animasi *spring* GPU 60fps bebas kedip, ikon wajik NawakAI 6 ekspresi dinamis di puncak kartu, layar Beranda grid 2×2, dan grid pilihan kolom export 2 kolom yang rapi.
            - **Voice Command Native Android & Web (`id-ID`):** Dukungan input suara langsung (`RecognizerIntent` di Android + `SpeechRecognition` Web) lengkap dengan animasi *equalizer* datar.
            - **24 Skill Agentic di 6 Domain:** Memori revisi *multi-turn*, audit klasifikasi & kebersihan data NIK/HP, catat pembayaran via suara/chat, proyeksi kas (*what-if*), audit transaksi *pending*, generator pengumuman WA detail (Laporan Kas, Acara, Tahlil, Berita Duka, Kerja Bakti), draf Surat Pengantar RT 17, pengingat WA santun, jadwal ronda, agenda kalender, log aduan warga, dan paket laporan rapat RT.
            ### Perbaikan Klasifikasi & Iuran Tahunan
            - **Kepala Keluarga Efektif:** Otomatis memprioritaskan nama istri aktif di Data KK, Detail KK, Cash RT, NawakAI, dan Export Warga bila Kepala Keluarga berstatus *Meninggal Dunia*.
            - **Deduplikasi Tagihan Tahunan:** 1 tahun hanya menghitung maksimal 1 tagihan per kategori, dan badge tunggakan hanya muncul untuk piutang lintas tahun (`>= 2` tahun).
