name: Build WargaKITA APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan Sumber Android
        run: |
          rm -rf extracted_repo
          if [ -f "WargaKITA_GitHub_Backup_v1.16.1.zip" ]; then
            LATEST_ZIP="WargaKITA_GitHub_Backup_v1.16.1.zip"
          else
            LATEST_ZIP=$(ls -1 WargaKITA_GitHub_Backup*.zip 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -n "$LATEST_ZIP" ] && [ -f "$LATEST_ZIP" ]; then
            unzip -oq "$LATEST_ZIP" -d extracted_repo
          elif [ -f "android/app/build.gradle.kts" ]; then
            mkdir -p extracted_repo
            cp -r android extracted_repo/android
          else
            echo "Folder android/ atau file WargaKITA_GitHub_Backup*.zip tidak ditemukan."
            exit 1
          fi
          cat << 'PROPS' > extracted_repo/android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          PROPS

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan Keystore & Build APK
        working-directory: extracted_repo/android
        env:
          WK_KEYSTORE_B64: ${{ secrets.WK_KEYSTORE_BASE64 }}
          WK_KEYSTORE_PASS: ${{ secrets.WK_KEYSTORE_PASS }}
          WK_KEY_ALIAS: ${{ secrets.WK_KEY_ALIAS || secrets.WK_KEYSTORE_ALIAS }}
          WK_KEY_PASS: ${{ secrets.WK_KEY_PASS || secrets.WK_KEYSTORE_PASS }}
        run: |
          if [ -n "$WK_KEYSTORE_B64" ]; then
            echo "$WK_KEYSTORE_B64" | base64 -d > release.keystore
            export WK_KEYSTORE_PATH="$(pwd)/release.keystore"
            if [ -z "$WK_KEY_ALIAS" ]; then
              WK_KEY_ALIAS=$(keytool -list -keystore release.keystore -storepass "$WK_KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n1 | sed 's/.*Alias name:[[:space:]]*//I' | tr -d '\r' || true)
              export WK_KEY_ALIAS
            fi
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../WargaKITA-RT17-v1.16.1.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../WargaKITA-RT17-v1.16.1.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-v1.16.1-apk
          path: WargaKITA-RT17-v1.16.1.apk

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.16.1' }}
          name: WargaKITA RT 17 (v1.16.1)
          files: WargaKITA-RT17-v1.16.1.apk
          make_latest: true
          body: |
            ## Pembaruan WargaKITA v1.16.1 (versionCode 27)
            ### Splash Screen Pembuka — Fondasi Kebersamaan (Isometric Lift & Grow Bloom)
            - **Opening Splash Screen (3,4 detik · Fresh Light `#F8FBFF`):** Ikon hidup 4 lapisan WebP transparan tanpa border (`hand` terangkat isometrik + 3 sosok warga `center`, `left`, `right` tumbuh berurutan), 6 chip fitur utama heksagonal 3D (*Kas RT, Iuran, NawakAI, Laporan, Info RT, Data Warga* — tanpa Ronda), *wordmark* WargaKITA 17, *progress bar* flat (*"Guyup rukun melayani warga..."*), isolasi penuh `.wk-sp-*`, dukungan `prefers-reduced-motion`, dan auto-hapus dari DOM (`window.wkHideSplash()`).
            ### Fitur Checkpoint v1.16.0 (Tetap Utuh)
            - **NawakAI Agent AI (P1–P3) & NLU 5 Lapis:** Memori multi-turn, 24 skill agentic, 150+ normalisasi slang/Malangan + Damerau-Levenshtein ≤ 2, Voice Command & TTS, serta Aksi Cepat.
            - **Paket B & Material You:** In-flight lock, offline auto-reconnect, kartu Kesehatan Sistem, lazy-load jsPDF/XLSX, IndexedDB media cache, dan Full Material You Dynamic Palette.
            - **Data Warga, Export `.docx` & Ronda Des 2026:** Export Word `.docx` OOXML murni, filter status warga, pemisahan Warga Kontrak di bagian bawah tabel, footer PDF 7 kartu KPI, dan jadwal Ronda Desember 2026.
