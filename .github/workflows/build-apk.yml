name: Build WargaKITA APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan Sumber Android
        run: |
          rm -rf extracted_repo
          if [ -f "WargaKITA_GitHub_Backup_v1.17.0.zip" ]; then
            LATEST_ZIP="WargaKITA_GitHub_Backup_v1.17.0.zip"
          else
            LATEST_ZIP=$(ls -1 WargaKITA_GitHub_Backup*.zip 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -n "$LATEST_ZIP" ] && [ -f "$LATEST_ZIP" ]; then
            unzip -oq "$LATEST_ZIP" -d extracted_repo
          elif [ -f "android/app/build.gradle.kts" ]; then
            mkdir -p extracted_repo
            cp -r android extracted_repo/android
          else
            echo "Folder android/ atau file WargaKITA_GitHub_Backup*.zip tidak ditemukan."
            exit 1
          fi
          cat << 'PROPS' > extracted_repo/android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          PROPS

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan Keystore & Build APK
        working-directory: extracted_repo/android
        env:
          WK_KEYSTORE_B64: ${{ secrets.WK_KEYSTORE_BASE64 }}
          WK_KEYSTORE_PASS: ${{ secrets.WK_KEYSTORE_PASS }}
          WK_KEY_ALIAS: ${{ secrets.WK_KEY_ALIAS || secrets.WK_KEYSTORE_ALIAS }}
          WK_KEY_PASS: ${{ secrets.WK_KEY_PASS || secrets.WK_KEYSTORE_PASS }}
        run: |
          VER_NAME=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"(.*)".*/\1/' | tr -d '\r')
          VER_CODE=$(grep -E 'versionCode[[:space:]]*=' app/build.gradle.kts | head -n1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/' | tr -d '\r')
          APK_OUT="WargaKITA-RT17-v${VER_NAME}-VersionCode-${VER_CODE}.apk"
          echo "VER_NAME=${VER_NAME}" >> "$GITHUB_ENV"
          echo "VER_CODE=${VER_CODE}" >> "$GITHUB_ENV"
          echo "APK_OUT=${APK_OUT}" >> "$GITHUB_ENV"
          if [ -n "$WK_KEYSTORE_B64" ]; then
            echo "$WK_KEYSTORE_B64" | base64 -d > release.keystore
            export WK_KEYSTORE_PATH="$(pwd)/release.keystore"
            if [ -z "$WK_KEY_ALIAS" ]; then
              WK_KEY_ALIAS=$(keytool -list -keystore release.keystore -storepass "$WK_KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n1 | sed 's/.*Alias name:[[:space:]]*//I' | tr -d '\r' || true)
              export WK_KEY_ALIAS
            fi
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "../../${APK_OUT}"
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../../${APK_OUT}"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-v${{ env.VER_NAME }}-VersionCode-${{ env.VER_CODE }}-apk
          path: ${{ env.APK_OUT }}

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VER_NAME) }}
          name: WargaKITA RT 17 (v${{ env.VER_NAME }})
          files: ${{ env.APK_OUT }}
          make_latest: true
          body: |
            ## WargaKITA RT 17 — v${{ env.VER_NAME }} (Version Code: ${{ env.VER_CODE }})

            ### Sub-APK Tersedia
            - **WargaKITA RT-17 v${{ env.VER_NAME }} Version Code: ${{ env.VER_CODE }}** (`${{ env.APK_OUT }}`) — *Build Terbaru*
            - **WargaKITA RT-17 v1.17.0 Version Code: 29** (`WargaKITA-RT17-v1.17.0.apk`) — *Rilis Awal v1.17.0*

            ### Pembaruan Version Code ${{ env.VER_CODE }} (v${{ env.VER_NAME }})
            - **Deteksi Update Sub-APK Multi-Build (`Version Code`):** Menampilkan `v1.17.0 (Version Code: 30)` di dalam aplikasi, mengarahkan seluruh versi terdahulu (`v1.15.x`, `v1.16.x`, maupun `v1.17.0` build sebelumnya) ke sub-APK dengan Version Code tertinggi, popup **"Apa yang Baru"** otomatis di Dashboard saat membuka aplikasi, serta notifikasi Android latar belakang setiap 30 menit bagi perangkat yang belum dibuka.
            - **Anti Auto-Scroll ke Atas Saat Gulir ke Bawah:** Mempertahankan posisi gulir `#scrollArea` dan fokus input ketik saat sinkronisasi *real-time* berjalan di latar belakang.
            - **Tombol Back Menutup Dropdown Terbuka Lebih Dulu:** Menekan tombol Back Android saat menu pilihan blur terbuka kini menutup dropdown tersebut tanpa berpindah ke menu/tab sebelumnya.
            - **Warna Ikon Refresh/Reload Mengikuti Tema Aktif:** Indikator *pull-to-refresh* kini selaras otomatis dengan 4 palet Material You (*Samudra, Zamrud Asri, Violet Senja, Koral Hangat*) maupun Mode Gelap.

            ### Fitur Utama v1.17.0
            - **Desain Android 17 (Material 3 Expressive) & Dark Mode Dinamis:** Redesign 5 tab utama, *Desktop Navigation Rail*, dan 4 palet warna Material You.
            - **Iuran Tahunan (`010`) & Urutan KK Baku (`009`):** Konsolidasi 1 tagihan/tahun/kategori, cicilan lintas bulan, rollover tahunan (`2026 ↔ 2027`), pelunasan FIFO, dan koreksi tunggakan manual tahun sebelumnya.
            - **Notifikasi Real-Time WebSocket, Laporan Petugas & 14 Hak Akses:** Siaran Info Warga *real-time* `/ws`, kontrol siaran & kartu ulang tahun khusus pengurus inti, serta unduh & pasang APK langsung di dalam aplikasi.
