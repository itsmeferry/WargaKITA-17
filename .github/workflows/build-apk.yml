name: Build WargaKITA APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Siapkan Sumber Android
        run: |
          rm -rf extracted_repo
          if [ -f "WargaKITA_GitHub_Backup_v1.17.0.zip" ]; then
            LATEST_ZIP="WargaKITA_GitHub_Backup_v1.17.0.zip"
          else
            LATEST_ZIP=$(ls -1 WargaKITA_GitHub_Backup*.zip 2>/dev/null | sort -V | tail -n1 || true)
          fi
          if [ -n "$LATEST_ZIP" ] && [ -f "$LATEST_ZIP" ]; then
            unzip -oq "$LATEST_ZIP" -d extracted_repo
          elif [ -f "android/app/build.gradle.kts" ]; then
            mkdir -p extracted_repo
            cp -r android extracted_repo/android
          else
            echo "Folder android/ atau file WargaKITA_GitHub_Backup*.zip tidak ditemukan."
            exit 1
          fi
          cat << 'PROPS' > extracted_repo/android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          PROPS

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan Keystore & Build APK
        working-directory: extracted_repo/android
        env:
          WK_KEYSTORE_B64: ${{ secrets.WK_KEYSTORE_BASE64 }}
          WK_KEYSTORE_PASS: ${{ secrets.WK_KEYSTORE_PASS }}
          WK_KEY_ALIAS: ${{ secrets.WK_KEY_ALIAS || secrets.WK_KEYSTORE_ALIAS }}
          WK_KEY_PASS: ${{ secrets.WK_KEY_PASS || secrets.WK_KEYSTORE_PASS }}
        run: |
          if [ -n "$WK_KEYSTORE_B64" ]; then
            echo "$WK_KEYSTORE_B64" | base64 -d > release.keystore
            export WK_KEYSTORE_PATH="$(pwd)/release.keystore"
            if [ -z "$WK_KEY_ALIAS" ]; then
              WK_KEY_ALIAS=$(keytool -list -keystore release.keystore -storepass "$WK_KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n1 | sed 's/.*Alias name:[[:space:]]*//I' | tr -d '\r' || true)
              export WK_KEY_ALIAS
            fi
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../WargaKITA-RT17-v1.17.0.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../WargaKITA-RT17-v1.17.0.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-v1.17.0-apk
          path: WargaKITA-RT17-v1.17.0.apk

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.17.0' }}
          name: WargaKITA RT 17 (v1.17.0)
          files: WargaKITA-RT17-v1.17.0.apk
          make_latest: true
          body: |
            ## Pembaruan WargaKITA v1.17.0 (versionCode 29)

            ### Desain Android 17 (Material 3 Expressive) & Dark Mode Dinamis
            - **Konsisten di Seluruh 5 Tab:** Redesign Material 3 Expressive di *Dashboard, Data Warga, Data KK & Iuran, Cash RT, dan Lainnya*, lengkap dengan *Bottom Navigation Bar* mobile dan *Desktop Navigation Rail*.
            - **4 Palet Warna Material You:** *Samudra RT 17, Zamrud Asri, Violet Senja, Koral Hangat* + mode **Terang / Gelap / Otomatis Sistem** serta grafik batang Dashboard & donat Cash RT yang selaras otomatis dengan palet aktif.

            ### Iuran Tahunan, Tunggakan Manual & Urutan KK Baku
            - **Aturan Iuran Tahunan (`010`):** Konsolidasi 1 tagihan/tahun/kategori dengan cicilan lintas bulan, navigasi lintas tahun (`2026 ↔ 2027`), pelunasan otomatis FIFO tahun terlama, serta input/koreksi tunggakan manual tahun sebelumnya (`>= 2020`).
            - **Urutan Anggota KK Baku (`009`):** Penyeragaman urutan anggota keluarga di Detail KK, Data Warga, NawakAI, & seluruh Export (`Kepala Keluarga → Istri/Suami → Anak → Menantu → Cucu → Orang Tua → Mertua → Famili Lain`).

            ### Notifikasi Real-Time WebSocket, Laporan Petugas & 14 Hak Akses
            - **Siaran Info Warga Real-Time (`server.ts`):** Server WebSocket `/ws` menyiarkan Info Ronda, Kerja Bakti, Pengumuman RT & Agenda langsung ke semua perangkat, dengan kontrol khusus *Developer, Pak RT & Wakil RT* (termasuk edit Kartu Ucapan Ulang Tahun).
            - **Laporan Kas Bulanan & Per Petugas PDF:** Otomatis memilih cakupan petugas sesuai akun login, perbandingan *Month-over-Month*, & rincian pembayar per petugas.
            - **Panel Developer:** Ekspansi **14 centang hak akses granular** tersinkron hingga RLS database.
            ### Pengunduh APK Dalam Aplikasi, Deteksi Build Ulang & Perbaikan Dropdown
            - **Unduh & Pasang Update Langsung Di Dalam Aplikasi:** Progress bar persentase & MB real-time langsung di dialog update tanpa keluar ke browser eksternal, dilanjutkan pemasangan APK otomatis (`PackageInstaller`).
            - **Deteksi Pembaruan Build Pada Versi Sama (`v1.17.0`):** `UpdateCheckReceiver` & `checkAppUpdate()` mendeteksi rilis APK terbaru berdasarkan stempel waktu kompilasi (`BUILD_EPOCH_MS`) dan notifikasi siaran real-time.
            - **Pelindung Dropdown Anti-Salah Pencet Saat Scroll:** Mencegah seluruh dropdown terbuka tidak sengaja ketika pengguna menggulir halaman.
