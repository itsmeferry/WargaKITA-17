name: Build WargaKITA APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ekstrak Paket Android
        run: |
          rm -rf extracted_repo
          unzip -q WargaKITA_GitHub_Backup.zip -d extracted_repo

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: extracted_repo/android
        run: gradle assembleDebug --no-daemon

      - name: Siapkan File APK
        run: cp extracted_repo/android/app/build/outputs/apk/debug/app-debug.apk WargaKITA-RT17-v1.12.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WargaKITA-debug-apk
          path: WargaKITA-RT17-v1.12.0.apk

      - name: Publikasikan ke GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.12.0' }}
          name: WargaKITA RT 17 (v1.12.0)
          files: WargaKITA-RT17-v1.12.0.apk
          make_latest: true
