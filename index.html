function formatRp(n) { return "Rp " + Number(n || 0).toLocaleString("id-ID"); }
function maskLast4(val) { return val ? "••••" + String(val).slice(-4) : "-"; }
function greetingText() {
  const h = new Date().getHours();
  if (h < 11) return "Selamat Pagi,";
  if (h < 15) return "Selamat Siang,";
  if (h < 18) return "Selamat Sore,";
  return "Selamat Malam,";
}

function showToast(msg) {
  const b = document.getElementById("toastBox");
  b.textContent = msg;
  b.classList.remove("hidden");
  clearTimeout(b._t);
  b._t = setTimeout(() => b.classList.add("hidden"), 2800);
}

function openModal(html) {
  const m = document.getElementById("modalRoot");
  m.innerHTML = html;
  m.classList.remove("hidden");
}
function closeModal() {
  const m = document.getElementById("modalRoot");
  m.classList.add("hidden");
  m.innerHTML = "";
}

  return ROLE_META[r] || ROLE_META.wakil_rt;
}

async function logUserActivity(action, entityType, entityId, reason) {
  if (!db || !state.session) return;
  try {
    await db.from("audit_logs").insert({
      actor_id: state.session.user.id,
      action,
      entity_type: entityType,
      entity_id: entityId || null,
      reason: reason || null
    });
  } catch (_) {}
}

function getHeadNameForHousehold(householdId) {
  const members = state.residents.filter(r => r.household_id === householdId);
  const head = members.find(m => m.family_relationship === "Kepala Keluarga") || members[0];
  if (head) return head.full_name;
  const hh = state.households.find(h => h.id === householdId);
  return hh ? "KK " + maskLast4(hh.household_number) : "Warga";
}

function enrichCashTransactions() {
  return state.cashTransactions.map(tx => {
    let title = tx.description || tx.category;
    let methodLabel = tx.payment_method || "Tunai";
    let categoryLabel = tx.category || "-";

    if (tx.payment_id) {
      const pay = state.payments.find(p => p.id === tx.payment_id);
      const alloc = state.allocations.find(a => a.payment_id === tx.payment_id);
      const due = alloc ? state.dues.find(d => d.id === alloc.household_due_id) : null;
      const cat = due ? state.feeCategories.find(c => c.id === due.fee_category_id) : null;
      const headName = pay ? getHeadNameForHousehold(pay.household_id) : "";

      if (pay) {
        const isQris = (pay.notes || "").toUpperCase().includes("QRIS");
        methodLabel = isQris ? "QRIS" : (pay.payment_method || "Tunai");
        if (cat && headName) {
          title = `Pembayaran ${cat.name} — ${headName}`;
        } else if (headName) {
          title = `Pembayaran Iuran — ${headName}`;
        }
        categoryLabel = cat ? cat.name : "Iuran Warga";
      }
    }
    return { ...tx, _title: title, _method: methodLabel, _catLabel: categoryLabel };
  });
}

async function loadAllData(silent) {
  if (!db || !state.session) return;
  if (!silent) { state.loading = true; state.errorMsg = ""; render(); }

  try {
    const uid = state.session.user.id;
    const [
      { data: cats, error: e1 },
      { data: hhs, error: e2 },
      { data: res, error: e3 },
      { data: dues, error: e4 },
      { data: pays },
      { data: allocs, error: e5 },
      { data: cash, error: e6 },
      { data: ob, error: e7 },
      { data: logs }
    ] = await Promise.all([
      db.from("fee_categories").select("id,name,default_amount,is_active").order("name"),
      db.from("households").select("id,household_number,head_resident_id,address,residence_status,is_active,notes").order("household_number"),
      db.from("residents").select("id,household_id,nik,full_name,birth_place,birth_date,gender,family_relationship,religion,phone,address_override,is_active,notes").order("full_name"),
      db.from("household_dues").select("id,household_id,fee_category_id,period_month,period_year,amount_due").eq("period_month", state.periodMonth).eq("period_year", state.periodYear),
      db.from("payments").select("id,household_id,payment_method,notes,status").neq("status", "voided"),
      db.from("payment_allocations").select("id,payment_id,household_due_id,amount_allocated,payments!inner(status)"),
      db.from("cash_transactions").select("id,transaction_date,transaction_type,category,description,amount,payment_id,payment_method,reference_number,status").neq("status", "voided").order("transaction_date", { ascending: false }).limit(150),
      db.from("cash_opening_balances").select("amount").eq("period_month", state.periodMonth).eq("period_year", state.periodYear).maybeSingle(),
      db.from("audit_logs").select("id,actor_id,action,entity_type,reason,timestamp").eq("actor_id", uid).order("timestamp", { ascending: false }).limit(40)
    ]);

    const firstErr = e1 || e2 || e3 || e4 || e5 || e6 || e7;
    if (firstErr) state.errorMsg = "Gagal memuat data: " + firstErr.message;

    state.feeCategories = cats || [];
    state.households = hhs || [];
    state.residents = res || [];
    state.dues = dues || [];
    state.payments = pays || [];
    state.allocations = (allocs || []).filter(a => a.payments && a.payments.status !== "voided");
    state.cashTransactions = cash || [];
    state.openingBalance = ob ? Number(ob.amount || 0) : 0;
    state.auditLogs = (logs || []).filter(l => !RAW_TRIGGER_ACTIONS.has(l.action));
  } catch (err) {
    state.errorMsg = "Koneksi sedang lambat. Silakan ketuk Segarkan.";
  } finally {
    state.loading = false;
    render();
  }
}

function getHouseholdDuesSummary(householdId) {
  const items = state.dues.filter(d => d.household_id === householdId);
  const totalDue = items.reduce((s, x) => s + Number(x.amount_due || 0), 0);
  let totalPaid = 0;
  const unpaidCats = [];

  items.forEach(d => {
    const paidForDue = state.allocations
      .filter(a => a.household_due_id === d.id)
      .reduce((s, a) => s + Number(a.amount_allocated || 0), 0);
    d._paid = paidForDue;
    totalPaid += paidForDue;
    if (paidForDue < Number(d.amount_due || 0)) {
      const cat = state.feeCategories.find(c => c.id === d.fee_category_id);
      if (cat) unpaidCats.push(cat.name);
    }
  });

  const remaining = Math.max(0, totalDue - totalPaid);
  let status = "ABU-ABU", pct = 0;
  if (totalDue > 0) {
    pct = Math.min(100, Math.round((totalPaid / totalDue) * 100));
    status = totalPaid >= totalDue ? "HIJAU" : (totalPaid > 0 ? "KUNING" : "MERAH");
  }
  return { items, totalDue, totalPaid, remaining, pct, status, unpaidCats };
}

function getGlobalSummary() {
  const totalKK = state.households.filter(h => h.is_active).length;
  const totalWarga = state.residents.filter(r => r.is_active).length;
  const income = state.cashTransactions.filter(t => t.transaction_type === "income").reduce((s, t) => s + Number(t.amount || 0), 0);
  const expense = state.cashTransactions.filter(t => t.transaction_type === "expense").reduce((s, t) => s + Number(t.amount || 0), 0);
  const kasBalance = state.openingBalance + income - expense;
  let totalTunggakan = 0, merah = 0;
  state.households.filter(h => h.is_active).forEach(h => {
    const s = getHouseholdDuesSummary(h.id);
    totalTunggakan += s.remaining;
    if (s.status === "MERAH") merah++;
  });

  const duesIncomeByCat = state.feeCategories.map(c => {
    const sum = state.dues.filter(d => d.fee_category_id === c.id).reduce((acc, d) => {
      const paid = state.allocations.filter(a => a.household_due_id === d.id).reduce((s2, a) => s2 + Number(a.amount_allocated || 0), 0);
      return acc + paid;
    }, 0);
    return { id: c.id, name: c.name, amount: sum };
  });
  const totalDuesIncome = duesIncomeByCat.reduce((s, c) => s + c.amount, 0);
  const otherIncome = Math.max(0, income - totalDuesIncome);

  return { totalKK, totalWarga, income, expense, kasBalance, totalTunggakan, merah, duesIncomeByCat, otherIncome };
}

function statusBadgeHtml(status) {
  if (status === "HIJAU") return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700">LUNAS</span>`;
  if (status === "KUNING") return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700">SEBAGIAN</span>`;
  if (status === "MERAH") return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-50 text-rose-700">BELUM BAYAR</span>`;
  return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-600">TANPA TAGIHAN</span>`;
}

        <div class="flex items-center justify-between">

        ${sum.items.length === 0 ? `<p class="text-xs text-slate-500">Belum ada tagihan pada periode ini.</p>` : `
          <div class="space-y-2">
            ${sum.items.map(d => {
              const cat = state.feeCategories.find(c => c.id === d.fee_category_id);
              const paid = Number(d._paid || 0), due = Number(d.amount_due || 0);
              const lunas = paid >= due, seb = paid > 0 && paid < due;
              return `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-between">
                  <div>
                    <p class="text-xs font-bold text-slate-800">${cat ? cat.name : "-"}</p>
                    <p class="text-[11px] text-slate-500">${formatRp(due)} (Terbayar: ${formatRp(paid)})</p>

                    ${lunas ? 'LUNAS' : seb ? 'SEBAGIAN' : 'BELUM BAYAR'}
                  </span>
                </div>
              `;
            }).join("")}
          </div>

          <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-center">
            <div><p class="text-[10px] text-slate-500">Total Kewajiban</p><p class="text-xs font-bold text-slate-900">${formatRp(sum.totalDue)}</p></div>
            <div><p class="text-[10px] text-slate-500">Sudah Dibayar</p><p class="text-xs font-bold text-emerald-600">${formatRp(sum.totalPaid)}</p></div>
            <div><p class="text-[10px] text-slate-500">Sisa Tunggakan</p><p class="text-xs font-bold text-rose-600">${formatRp(sum.remaining)}</p></div>
          </div>

          <div>
            <div class="flex justify-between text-[11px] font-semibold mb-1"><span>Status Pelunasan KK</span><span>${sum.pct}%</span></div>
            <div class="w-full h-2.5 rounded-full bg-slate-100 overflow-hidden">
              <div class="h-full rounded-full ${sum.status === 'HIJAU' ? 'bg-emerald-500' : sum.status === 'KUNING' ? 'bg-amber-400' : 'bg-rose-500'}" style="width: ${sum.pct}%"></div>
            </div>
          </div>
        `}

        ${(perms.canPay && sum.remaining > 0) ? `
          <button id="payThisKKBtn" data-kk-id="${h.id}" type="button" class="w-full h-11 btn-accent text-xs font-semibold">Catat Pembayaran KK Ini</button>
        ` : ""}
      </div>
    </div>
  `;
}

        <div class="flat-card p-3.5"><p class="text-xs text-slate-500">↓ Pengeluaran</p><p class="text-base font-bold text-rose-600 mt-1">${formatRp(s.expense)}</p></div>
        <div class="flat-card p-3.5"><p class="text-xs text-slate-500">Saldo Awal</p><p class="text-base font-bold text-[#1d4ed8] mt-1">${formatRp(state.openingBalance)}</p></div>
        <div class="flat-card p-3.5"><p class="text-xs text-slate-500">Tunggakan</p><p class="text-base font-bold text-rose-600 mt-1">${formatRp(s.totalTunggakan)}</p></div>

            ${s.duesIncomeByCat.map((c, idx) => {

                <div class="flex items-center justify-between text-xs">
                  <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full" style="background:${CAT_COLORS[idx % CAT_COLORS.length]}"></span><span class="font-medium text-slate-700">${c.name}</span></div>

}

function initCharts() {
  if (typeof Chart === "undefined") return;
  const dashCanvas = document.getElementById("dashboardIncomeChart");
  if (dashCanvas) {
    if (dashboardChartInstance) dashboardChartInstance.destroy();
    const s = getGlobalSummary();
    dashboardChartInstance = new Chart(dashCanvas, {
      type: "bar",
      data: {
        labels: ["Jun", "Jul", "Agu", "Sep", "Okt", "Nov"],
        datasets: [{ data: [0, 0, 0, 0, 0, s.income], backgroundColor: ["#e2e8f0","#e2e8f0","#e2e8f0","#e2e8f0","#e2e8f0","#1d4ed8"], borderRadius: 6, barThickness: 18 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { display: false, beginAtZero: true }, x: { grid: { display: false }, border: { display: false }, ticks: { color: "#64748b", font: { size: 11 } } } } }
    });
  }

  const donutCanvas = document.getElementById("cashDonutChart");
  if (donutCanvas) {
    if (cashDonutInstance) cashDonutInstance.destroy();
    const catTotals = state.feeCategories.map(c => state.dues.filter(d => d.fee_category_id === c.id).reduce((sum, d) => sum + Number(d._paid || 0), 0));
    cashDonutInstance = new Chart(donutCanvas, {
      type: "doughnut",
      data: {
        labels: state.feeCategories.map(c => c.name),
        datasets: [{ data: catTotals.some(v => v > 0) ? catTotals : [1], backgroundColor: catTotals.some(v => v > 0) ? CAT_COLORS : ["#e2e8f0"], borderWidth: 2, borderColor: "#ffffff" }]
      },
      options: { responsive: true, maintainAspectRatio: false, cutout: "66%", plugins: { legend: { display: false } } }
    });
  }
}

    closeModal(); showToast("Password baru berhasil disimpan."); await loadAllData(true);

  const searchEl = document.getElementById("modalKKSearch");
  const kkListEl = document.getElementById("modalKKList");
  const catSel = document.getElementById("payCat");
  const dueInfo = document.getElementById("payDueInfo");
  const amtInput = document.getElementById("payAmount");
  const methodSel = document.getElementById("payMethod");
  const qrisBox = document.getElementById("qrisInfoBox");
  const norekBox = document.getElementById("norekInfoBox");

  function handleReceiptFile(file) {
    if (!file) return;
    state.receiptFileName = file.name;
    const reader = new FileReader();
    reader.onload = (ev) => {
      state.receiptPreviewDataUrl = ev.target.result;
      document.getElementById("receiptPreviewImg").src = state.receiptPreviewDataUrl;
      document.getElementById("receiptNameLbl").textContent = "Terlampir: " + file.name;
      document.getElementById("receiptPreviewBox").classList.remove("hidden");
    };
    reader.readAsDataURL(file);
  }
  document.getElementById("receiptGalleryInput").onchange = (e) => handleReceiptFile(e.target.files[0]);
  document.getElementById("receiptCameraInput").onchange = (e) => handleReceiptFile(e.target.files[0]);

  methodSel.onchange = () => {
    qrisBox.classList.toggle("hidden", methodSel.value !== "QRIS");
    norekBox.classList.toggle("hidden", methodSel.value !== "Transfer");
  };

  function renderPicker() {
    const q = searchEl.value.toLowerCase().trim();
    const filtered = sortedKK.filter(h => !q || h.headName.toLowerCase().includes(q) || h.memberNames.includes(q) || (h.household_number || "").includes(q));
    kkListEl.innerHTML = filtered.length === 0 ? `<p class="text-xs text-slate-400 p-2">Warga/KK tidak ditemukan.</p>` : filtered.map(h => `
      <button type="button" data-pick-kk="${h.id}" class="w-full p-2.5 rounded-xl border text-left flex justify-between text-xs ${h.id === selectedKKId ? 'border-[#1d4ed8] bg-[#eff6ff]' : 'border-slate-200'}">
        <span class="font-semibold truncate pr-2">${h.headName}</span>
        <span class="shrink-0">${h.sum.remaining > 0 ? 'Sisa ' + formatRp(h.sum.remaining) : 'Lunas'}</span>
      </button>
    `).join("");
    kkListEl.querySelectorAll("[data-pick-kk]").forEach(b => b.onclick = () => { selectedKKId = b.getAttribute("data-pick-kk"); renderPicker(); refreshDue(); });
  }

  function refreshDue() {
    if (catSel.value === "ALL") {
      const sum = getHouseholdDuesSummary(selectedKKId);
      dueInfo.textContent = `Total sisa keseluruhan tagihan KK ini: ${formatRp(sum.remaining)}`;
      amtInput.value = sum.remaining;
      amtInput.readOnly = true;
    } else {
      amtInput.readOnly = false;
      const due = state.dues.find(d => d.household_id === selectedKKId && d.fee_category_id === catSel.value);
      if (!due) { dueInfo.textContent = "Tidak ada tagihan aktif untuk kategori ini."; amtInput.value = 0; }
      else { const rem = Math.max(0, Number(due.amount_due) - Number(due._paid || 0)); dueInfo.textContent = `Sisa tagihan: ${formatRp(rem)}`; amtInput.value = rem; }
    }
  }
  searchEl.oninput = renderPicker;
  catSel.onchange = refreshDue;
  renderPicker(); refreshDue();

  document.getElementById("closeModalBtn").onclick = closeModal;
  document.getElementById("submitPayBtn").onclick = async () => {
    const rawMethod = methodSel.value;
    const dbMethod = rawMethod === "Tunai" ? "Tunai" : "Transfer";
    const headName = getHeadNameForHousehold(selectedKKId);
    const noteParts = [rawMethod === "QRIS" ? "QRIS a.n. Fibriono (Ketua RT 17)" : rawMethod];
    if (state.receiptFileName) noteParts.push("Bukti: " + state.receiptFileName);
    const notes = noteParts.join(" | ");

    if (catSel.value === "ALL") {
      const unpaidDues = state.dues.filter(d => d.household_id === selectedKKId && (Number(d.amount_due) - Number(d._paid || 0)) > 0);
      if (unpaidDues.length === 0) return showToast("Semua tagihan KK ini sudah lunas.");
      let totalAll = 0;
      for (const d of unpaidDues) {
        const rem = Number(d.amount_due) - Number(d._paid || 0);
        totalAll += rem;
        const { data: pid, error } = await db.rpc("record_payment_atomic", {
          p_household_id: selectedKKId, p_due_id: d.id, p_amount: rem, p_method: dbMethod,
          p_idempotency_key: "WK-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
          p_notes: notes
        });
        if (error) return showToast("Gagal: " + error.message);
        if (state.receiptPreviewDataUrl && pid) saveReceiptLocal(pid, state.receiptFileName, state.receiptPreviewDataUrl);
      }
      await logUserActivity(`Catat Pembayaran: ${headName}`, "payments", selectedKKId, `Semua Kategori • Metode ${rawMethod} ${formatRp(totalAll)}`);
      closeModal(); showToast("Seluruh tagihan KK berhasil dilunasi."); await loadAllData(true);
      return;
    }

    const due = state.dues.find(d => d.household_id === selectedKKId && d.fee_category_id === catSel.value);
    const cat = state.feeCategories.find(c => c.id === catSel.value);
    const amt = Number(amtInput.value);
    if (!due || amt <= 0) return showToast("Tagihan atau nominal tidak valid.");

    const { data: payId, error } = await db.rpc("record_payment_atomic", {
      p_household_id: selectedKKId, p_due_id: due.id, p_amount: amt, p_method: dbMethod,
      p_idempotency_key: "WK-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      p_notes: notes
    });
    if (error) return showToast("Gagal: " + error.message);
    if (state.receiptPreviewDataUrl && payId) saveReceiptLocal(payId, state.receiptFileName, state.receiptPreviewDataUrl);
    await logUserActivity(`Catat Pembayaran: ${headName}`, "payments", payId, `${cat ? cat.name : 'Iuran'} • Metode ${rawMethod} ${formatRp(amt)}`);
    closeModal(); showToast("Pembayaran berhasil dicatat."); await loadAllData(true);
  };
}

function showAddCashModal() {
  let cashType = "expense";
  let cashReceiptUrl = "";
  let cashReceiptName = "";

  openModal(`
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-3 shadow-xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between"><h3 class="text-base font-bold">Catat Transaksi Kas RT</h3><button id="closeModalBtn" type="button">✕</button></div>

      <div class="grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-slate-100 text-xs">
        <button id="typeExpBtn" type="button" class="py-2 rounded-lg font-semibold bg-white text-rose-600 shadow-sm">↓ Pengeluaran Kas</button>
        <button id="typeIncBtn" type="button" class="py-2 rounded-lg font-semibold text-slate-500">↑ Pemasukan Kas</button>
      </div>

      <div class="space-y-2 text-xs">
        <div>
          <label class="text-[11px] font-semibold text-slate-500 block mb-1">Pilih Kategori</label>
          <select id="cashCat" class="w-full h-10 px-3 rounded-xl border border-slate-200 bg-white"></select>
        </div>
        <input id="cashDesc" type="text" placeholder="Deskripsi transaksi" class="w-full h-10 px-3 rounded-xl border border-slate-200" />
        <input id="cashAmt" type="number" min="1000" step="1000" placeholder="Nominal (Rp)" class="w-full h-10 px-3 rounded-xl border border-slate-200" />
      </div>

      <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2 text-xs">
        <p class="font-semibold text-slate-700">Upload Bukti Foto / Nota Kas</p>
        <div class="grid grid-cols-2 gap-2">
          <label class="h-9 rounded-lg bg-white border border-slate-200 flex items-center justify-center gap-1 cursor-pointer font-medium text-slate-700">
            🖼️ Galeri / File
            <input id="cashFileInput" type="file" accept="image/*,.pdf" class="hidden" />
          </label>
          <label class="h-9 rounded-lg bg-white border border-slate-200 flex items-center justify-center gap-1 cursor-pointer font-medium text-slate-700">
            📷 Foto Langsung
            <input id="cashCamInput" type="file" accept="image/*" capture="environment" class="hidden" />
          </label>
        </div>
        <div id="cashPreviewBox" class="hidden text-[11px] text-emerald-700 font-medium"></div>
      </div>

      <button id="saveCashBtn" type="button" class="w-full h-11 btn-accent text-xs font-semibold">Simpan Transaksi</button>
    </div>
  `);

  const catSel = document.getElementById("cashCat");
  const expBtn = document.getElementById("typeExpBtn");
  const incBtn = document.getElementById("typeIncBtn");

  function syncCategories() {
    const opts = CASH_CATEGORIES[cashType] || [];
    catSel.innerHTML = opts.map(c => `<option value="${c}">${c}</option>`).join("");
    expBtn.className = cashType === "expense" ? "py-2 rounded-lg font-semibold bg-white text-rose-600 shadow-sm" : "py-2 rounded-lg font-semibold text-slate-500";
    incBtn.className = cashType === "income" ? "py-2 rounded-lg font-semibold bg-white text-emerald-600 shadow-sm" : "py-2 rounded-lg font-semibold text-slate-500";
  }
  expBtn.onclick = () => { cashType = "expense"; syncCategories(); };
  incBtn.onclick = () => { cashType = "income"; syncCategories(); };
  syncCategories();

  function handleCashFile(file) {
    if (!file) return;
    cashReceiptName = file.name;
    const reader = new FileReader();
    reader.onload = (ev) => {
      cashReceiptUrl = ev.target.result;
      const box = document.getElementById("cashPreviewBox");
      box.textContent = "📎 Terlampir: " + file.name;
      box.classList.remove("hidden");
    };
    reader.readAsDataURL(file);
  }
  document.getElementById("cashFileInput").onchange = (e) => handleCashFile(e.target.files[0]);
  document.getElementById("cashCamInput").onchange = (e) => handleCashFile(e.target.files[0]);

  document.getElementById("closeModalBtn").onclick = closeModal;
  document.getElementById("saveCashBtn").onclick = async () => {
    const desc = document.getElementById("cashDesc").value.trim(), amt = Number(document.getElementById("cashAmt").value);
    if (!desc || amt <= 0) return showToast("Deskripsi dan nominal wajib diisi.");
    const refNum = "KAS-" + Date.now().toString().slice(-6);
    const { data: txRow, error } = await db.from("cash_transactions").insert({
      transaction_type: cashType,
      category: catSel.value,
      description: desc,
      amount: amt, reference_number: refNum,
      idempotency_key: (crypto.randomUUID ? crypto.randomUUID() : undefined),
      status: "posted", created_by: state.session.user.id
    }).select("id").single();
    if (error) return showToast("Gagal: " + error.message);
    if (cashReceiptUrl) saveReceiptLocal(refNum, cashReceiptName, cashReceiptUrl);
    await logUserActivity(`Catat ${cashType === 'income' ? 'Pemasukan' : 'Pengeluaran'} Kas: ${desc}`, "cash_transactions", txRow?.id, `${catSel.value} • ${formatRp(amt)}`);
    closeModal(); showToast("Transaksi kas tersimpan."); await loadAllData(true);
  };
}

function showShareReportModal() {
  const s = getGlobalSummary();
  const expenseList = state.cashTransactions.filter(t => t.transaction_type === "expense");
  const unpaidList = state.households.filter(h => h.is_active).map(h => {
    const head = state.residents.find(r => r.household_id === h.id && r.family_relationship === "Kepala Keluarga");
    return { ...h, headName: head ? head.full_name : "KK " + maskLast4(h.household_number), sum: getHouseholdDuesSummary(h.id) };
  }).filter(h => h.sum.status === "MERAH" || h.sum.status === "KUNING").sort((a, b) => a.headName.localeCompare(b.headName, "id"));

  openModal(`
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 space-y-3 shadow-xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between"><h3 class="text-sm font-bold">Preview Laporan Keuangan PNG</h3><button id="closeModalBtn" type="button">✕</button></div>
      <div class="rounded-2xl border border-slate-200 bg-[#f8fafc] p-4 space-y-2 text-xs">
        <p class="font-bold text-[#1d4ed8]">WargaKITA • RT 17 / RW 03 Kebonagung (${MONTHS[state.periodMonth - 1]} ${state.periodYear})</p>
        <p>Saldo Awal: <strong>${formatRp(state.openingBalance)}</strong> | Saldo Akhir: <strong class="text-[#1d4ed8]">${formatRp(s.kasBalance)}</strong></p>
        <div class="pt-1 border-t border-slate-200">
          <p class="font-bold text-emerald-700">Rincian Pemasukan:</p>
          ${s.duesIncomeByCat.map(c => `<div class="flex justify-between"><span>${c.name}</span><span>${formatRp(c.amount)}</span></div>`).join("")}
        </div>
        <div class="pt-1 border-t border-slate-200">
          <p class="font-bold text-rose-700">Rincian Pengeluaran (${expenseList.length}):</p>
          ${expenseList.slice(0, 4).map(t => `<div class="flex justify-between"><span>${t.description}</span><span>-${formatRp(t.amount)}</span></div>`).join("")}
        </div>
      </div>
      <button id="downloadPngBtn" type="button" class="w-full h-11 btn-accent text-xs font-semibold">Bagikan / Unduh PNG Sekarang</button>
    </div>
  `);
  document.getElementById("closeModalBtn").onclick = closeModal;
  document.getElementById("downloadPngBtn").onclick = () => {
    const canvas = document.createElement("canvas");
    canvas.width = 920; canvas.height = 1220;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#f8fafc"; ctx.fillRect(0, 0, 920, 1220);
    ctx.fillStyle = "#1d4ed8"; ctx.fillRect(0, 0, 920, 140);
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 30px Inter, sans-serif";
    ctx.fillText("WargaKITA — LAPORAN KEUANGAN RT 17", 48, 66);
    ctx.font = "18px Inter, sans-serif"; ctx.fillStyle = "#dbeafe";
    ctx.fillText(`RT 17 / RW 03 Kebonagung • ${MONTHS[state.periodMonth - 1]} ${state.periodYear}`, 48, 106);

    [["Saldo Awal", formatRp(state.openingBalance), "#1e293b"], ["Total Pemasukan", formatRp(s.income), "#059669"], ["Total Pengeluaran", formatRp(s.expense), "#dc2626"], ["Saldo Akhir", formatRp(s.kasBalance), "#1d4ed8"]].forEach((c, i) => {
      const x = 48 + (i % 2) * 422, y = 175 + Math.floor(i / 2) * 115;
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x, y, 402, 98);
      ctx.strokeStyle = "#e2e8f0"; ctx.strokeRect(x, y, 402, 98);
      ctx.fillStyle = "#64748b"; ctx.font = "16px Inter, sans-serif"; ctx.fillText(c[0], x + 20, y + 34);
      ctx.fillStyle = c[2]; ctx.font = "bold 26px Inter, sans-serif"; ctx.fillText(c[1], x + 20, y + 74);
    });

    ctx.fillStyle = "#047857"; ctx.font = "bold 20px Inter, sans-serif";
    ctx.fillText("Rincian Pemasukan per Kategori Iuran:", 48, 440);
    s.duesIncomeByCat.forEach((c, i) => {
      const y = 472 + i * 38;
      ctx.fillStyle = "#1e293b"; ctx.font = "17px Inter, sans-serif"; ctx.fillText(c.name, 56, y);
      ctx.font = "bold 17px Inter, sans-serif"; ctx.fillText(formatRp(c.amount), 680, y);
    });

    ctx.fillStyle = "#b91c1c"; ctx.font = "bold 20px Inter, sans-serif";
    ctx.fillText(`Rincian Pengeluaran (${expenseList.length}):`, 48, 650);
    expenseList.slice(0, 4).forEach((t, i) => {
      const y = 682 + i * 36;
      ctx.fillStyle = "#1e293b"; ctx.font = "16px Inter, sans-serif"; ctx.fillText(`${t.category} — ${t.description}`, 56, y);
      ctx.fillStyle = "#dc2626"; ctx.font = "bold 16px Inter, sans-serif"; ctx.fillText("-" + formatRp(t.amount), 680, y);
    });

    ctx.fillStyle = "#1e293b"; ctx.font = "bold 20px Inter, sans-serif";
    ctx.fillText(`Daftar KK Belum Lunas (${unpaidList.length} KK):`, 48, 855);
    unpaidList.slice(0, 6).forEach((h, idx) => {
      const y = 885 + idx * 46;
      ctx.fillStyle = "#ffffff"; ctx.fillRect(48, y, 824, 38);
      ctx.fillStyle = "#1e293b"; ctx.font = "16px Inter, sans-serif"; ctx.fillText(h.headName, 64, y + 25);
      ctx.fillStyle = "#dc2626"; ctx.font = "bold 16px Inter, sans-serif"; ctx.fillText(`Sisa ${formatRp(h.sum.remaining)}`, 680, y + 25);
    });

    canvas.toBlob(async (blob) => {
      const file = new File([blob], "Laporan_Keuangan_RT17.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "Laporan Keuangan RT 17" }); showToast("Laporan PNG dibagikan."); return; } catch (_) {}
      }
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = "Laporan_Keuangan_RT17.png";
      link.href = url; link.click();
      URL.revokeObjectURL(url);
      showToast("Laporan PNG berhasil diunduh.");
    }, "image/png");
  };
}

function bindLoginEvents() {
  const passInput = document.getElementById("loginPassword");
  document.getElementById("togglePassBtn").onclick = () => { passInput.type = passInput.type === "password" ? "text" : "password"; };
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    if (!db) return showToast("Layanan autentikasi belum siap.");
    let email = document.getElementById("loginEmail").value.trim();
    if (!email.includes("@")) email = `${email}@wargakita.id`;
    const password = passInput.value;
    state.loading = true; render();
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) { state.loading = false; showToast("Login gagal: " + error.message); render(); return; }

    const { data: prof, error: pErr } = await db.from("profiles").select("*").eq("id", data.user.id).single();
    if (pErr || !prof || !prof.is_active) {
      await db.auth.signOut();
      state.loading = false;
      showToast("Akun tidak aktif atau profil tidak ditemukan.");
      render(); return;
    }
    state.session = data.session;
    state.profile = prof;
    state.loading = false;
    await logUserActivity("Login", "profiles", prof.id, `${prof.display_name} masuk ke aplikasi`);
    if (prof.must_change_password) { render(); showForceChangePasswordModal(false); return; }
    await loadAllData(false);
  };
}

function bindScreenEvents() {
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.onclick = () => { state.activeTab = btn.getAttribute("data-nav"); state.selectedHouseholdId = null; render(); };
  });
  const ref = document.getElementById("refreshDataBtn"); if (ref) ref.onclick = () => loadAllData(false);

  const ws = document.getElementById("wargaSearchInput");
  if (ws) ws.oninput = (e) => { state.wargaSearch = e.target.value; render(); const el = document.getElementById("wargaSearchInput"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  document.querySelectorAll("[data-rel-filter]").forEach(b => b.onclick = () => { state.wargaReligionFilter = b.getAttribute("data-rel-filter"); render(); });
  document.querySelectorAll("[data-status-filter]").forEach(b => b.onclick = () => { state.wargaStatusFilter = b.getAttribute("data-status-filter"); render(); });
  document.querySelectorAll("[data-view-warga]").forEach(b => b.onclick = () => showWargaDetailModal(b.getAttribute("data-view-warga")));
  const addWBtn = document.getElementById("openAddWargaBtn"); if (addWBtn) addWBtn.onclick = showAddWargaModal;

  const kks = document.getElementById("kkSearchInput");
  if (kks) kks.oninput = (e) => { state.kkSearch = e.target.value; render(); const el = document.getElementById("kkSearchInput"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  document.querySelectorAll("[data-kk-color]").forEach(b => b.onclick = () => { state.kkColorFilter = b.getAttribute("data-kk-color"); render(); });
  document.querySelectorAll("[data-open-kk]").forEach(b => b.onclick = () => { state.selectedHouseholdId = b.getAttribute("data-open-kk"); render(); });

  const backKK = document.getElementById("backToKKBtn"); if (backKK) backKK.onclick = () => { state.selectedHouseholdId = null; render(); };
  const payBtn = document.getElementById("openPayModalBtn"); if (payBtn) payBtn.onclick = () => showPaymentModal(null);
  const payThis = document.getElementById("payThisKKBtn"); if (payThis) payThis.onclick = () => showPaymentModal(payThis.getAttribute("data-kk-id"));
  const addCash = document.getElementById("openAddCashBtn"); if (addCash) addCash.onclick = showAddCashModal;
  const shareBtn = document.getElementById("openShareReportBtn"); if (shareBtn) shareBtn.onclick = showShareReportModal;

  const printPdf = document.getElementById("printPdfReportBtn"); if (printPdf) printPdf.onclick = () => window.print();

  const avUp = document.getElementById("avatarUploadInput");
  if (avUp) avUp.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => { saveAvatarLocal(state.profile.id, ev.target.result); showToast("Foto profil diperbarui."); render(); };
    reader.readAsDataURL(file);
  };
  const chMyPass = document.getElementById("openChangeMyPassBtn"); if (chMyPass) chMyPass.onclick = () => showForceChangePasswordModal(true);
  const rstOther = document.getElementById("openResetOtherPassBtn"); if (rstOther) rstOther.onclick = showResetOtherPassModal;
  const rstMonth = document.getElementById("openResetMonthBtn"); if (rstMonth) rstMonth.onclick = showResetMonthModal;

  document.querySelectorAll("[data-view-receipt]").forEach(b => {
    b.onclick = () => {
      const rec = state.receiptStore[b.getAttribute("data-view-receipt")];
      if (!rec) return;
      openModal(`
        <div class="bg-white w-full max-w-md rounded-2xl p-4 space-y-3 shadow-xl">
          <div class="flex justify-between items-center"><h3 class="text-sm font-bold">Bukti Transaksi: ${rec.name}</h3><button id="closeModalBtn" type="button">✕</button></div>
          <img src="${rec.dataUrl}" alt="Bukti" class="w-full max-h-80 object-contain rounded-xl border border-slate-200" />
        </div>
      `);
      document.getElementById("closeModalBtn").onclick = closeModal;
    };
  });

  const prevM = document.getElementById("prevMonthBtn"); if (prevM) prevM.onclick = () => { state.periodMonth = state.periodMonth === 1 ? 12 : state.periodMonth - 1; loadAllData(false); };
  const nextM = document.getElementById("nextMonthBtn"); if (nextM) nextM.onclick = () => { state.periodMonth = state.periodMonth === 12 ? 1 : state.periodMonth + 1; loadAllData(false); };

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) logoutBtn.onclick = async () => { if (db) await db.auth.signOut(); state.session = null; state.profile = null; render(); };

  initCharts();
}

document.getElementById("toggleWidthBtn").onclick = () => {
  const f = document.getElementById("appFrame");
  f.classList.toggle("mobile-mode");
  document.getElementById("toggleWidthBtn").textContent = f.classList.contains("mobile-mode") ? "Tampilan Lebar (960px)" : "Tampilan Ponsel (430px)";
};

window.addEventListener("DOMContentLoaded", async () => {
  if (db) {
    const { data } = await db.auth.getSession();
    if (data && data.session) {
      const { data: prof } = await db.from("profiles").select("*").eq("id", data.session.user.id).maybeSingle();
      if (prof && prof.is_active) {
        state.session = data.session;
        state.profile = prof;
        if (prof.must_change_password) { render(); showForceChangePasswordModal(false); return; }
        await loadAllData(false);
        return;
      }
    }
  }
  render();
});
